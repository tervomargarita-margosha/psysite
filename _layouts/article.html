---
layout: default
---

<article class="article section">
  <div class="container article__container">

    <a href="{{ '/blog.html' | relative_url }}" class="article__back">← Все статьи</a>

    <header class="article__header">
      <h1 class="article__title">{{ page.title }}</h1>
      <p class="article__meta">{{ page.date | date: "%d.%m.%Y" }}</p>
    </header>

    <div class="article__content">
      {{ content }}
    </div>

    <div class="article__cta card">
      <p>Если что-то в статье откликнулось и захотелось обсудить — напишите мне.</p>
      <a href="https://t.me/tervo_psy" class="btn btn--primary" target="_blank" rel="noopener">Написать в Telegram</a>
    </div>

  </div>
</article>
